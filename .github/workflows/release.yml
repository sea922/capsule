name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate before versioning
        run: npm run check

      - name: Create Version Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version:skills
          publish-script: npx changeset tag
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"

      # Bot-created PRs count as external contributions, so their CI run waits
      # for approval. Approve it, then let auto-merge land the version PR once
      # the required checks pass on that exact head.
      - name: Approve CI and auto-merge the version PR
        if: steps.changesets.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs['pr-number'] }}
        run: |
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          for attempt in $(seq 1 12); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&status=action_required" --jq '.workflow_runs[].id')
            [ -n "$runs" ] && break
            sleep 5
          done
          for id in $runs; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" ||
              echo "::warning::Could not approve CI run $id; approve it under Actions."
          done
          gh pr merge "$PR" --auto --squash --match-head-commit "$head"
